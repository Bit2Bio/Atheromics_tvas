covariates: "age,gender"

stratified_descriptive:
  strat_var:     dm2
  group_labels:  "0:dm2 (0),1:dm2 (1)"
  exclude:       dm2

variables:
  - name: age
    excel_name: "Età"
    type: continuous
    transform: raw
  - name: gender
    excel_name: "sesso"
    type: categorical
  - name: ada_igm
    excel_name: "ADA con IGM (IFG+IGT)"
    type: categorical
  - name: dm2
    excel_name: "DM2 (anamnesi)"
    type: categorical
  - name: familiarity_dm
    excel_name: "Familiarità diabete"
    type: categorical
  - name: familiarity_cvd
    excel_name: "Familiarità CVD"
    type: categorical
  - name: smoking
    excel_name: "Fumo (0=no 1=si 2=ex)"
    type: categorical
  - name: ats_symptoms
    excel_name: "sintomi Ats carot"
    type: categorical
  - name: weight
    excel_name: "Peso"
    type: continuous
    transform: raw
  - name: height
    excel_name: "Altezza"
    type: continuous
    transform: raw
  - name: bmi
    excel_name: "BMI"
    type: continuous
    transform: raw
  - name: waist
    excel_name: "vita"
    type: continuous
    transform: raw
  - name: pa_syst
    excel_name: "PA syst"
    type: continuous
    transform: raw
  - name: pa_diast
    excel_name: "PA diast"
    type: continuous
    transform: raw
  - name: cholesterol
    excel_name: "colesterolo tot"
    type: continuous
    transform: raw
  - name: hdl
    excel_name: "HDL"
    type: continuous
    transform: raw
  - name: ldl
    excel_name: "LDL"
    type: continuous
    transform: raw
  - name: triglycerides
    excel_name: "trigliceridi"
