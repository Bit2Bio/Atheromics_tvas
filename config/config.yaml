  - name: ast
    excel_name: "AST"
    type: continuous
    transform: log
  - name: alt
    excel_name: "ALT"
    type: continuous
    transform: log
  - name: azotemia
    excel_name: "azotemia"
    type: continuous
    transform: raw
  - name: creatinine
    excel_name: "creatinina"
    type: continuous
    transform: log
  - name: gfr
